name: Deploy demo site

# The demo is the web app built with VITE_DEMO=1: an in-browser mock backend with
# synthetic data, no hub and no model calls. It deploys to GitHub Pages under /matemind/.

on:
    push:
        branches:
            - main
        paths:
            - 'web/**'
            - 'shared/**'
            - '.github/workflows/demo.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - name: Build the demo
              env:
                  VITE_BASE_URL: /${{ github.event.repository.name }}/
              run: bun run --cwd web build:demo
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: web/dist-demo

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
