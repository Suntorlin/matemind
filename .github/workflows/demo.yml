name: Deploy demo site

# The demo is the web app built with VITE_DEMO=1: an in-browser mock backend with
# synthetic data, no hub and no model calls. It deploys to Cloudflare Pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job builds and skips the deploy.

on:
    push:
        branches:
            - main
        paths:
            - 'web/**'
            - 'shared/**'
            - '.github/workflows/demo.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: demo-site
    cancel-in-progress: true

env:
    PROJECT_NAME: matemind-demo

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - name: Build the demo
              run: bun run --cwd web build:demo
            - name: Check Cloudflare secrets
              id: secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the demo was built but not deployed."
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Create the Pages project on first run
              if: steps.secrets.outputs.ready == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bunx wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || echo "Project exists."
            - name: Deploy to Cloudflare Pages
              if: steps.secrets.outputs.ready == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bunx wrangler@4 pages deploy web/dist-demo --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
